name: ✏️ Verify formatting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Verify formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Prettier
        run: npm install --no-save prettier

      - name: Run Prettier check
        run: npx prettier --check jquery.mjs.nestedSortable.js
